opensabre:
  governance:
    enabled: true
    sysadmin:
      service-id: base-sysadmin
    registration:
      max-attempts: 4
      initial-backoff: 1s
      max-backoff: 30s
      jitter: 0.2
      pool-size: 2
      thread-name-prefix: governance-registration-
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 35s
    audit:
      enabled: true
      async:
        core-pool-size: 2
        max-pool-size: 8
        queue-capacity: 1000
        thread-name-prefix: audit-event-
        wait-for-tasks-to-complete-on-shutdown: false
    ratelimit:
      enabled: true
      fail-open: true
    error-catalog:
      enabled: true
      registration-token: ${ERROR_CATALOG_REGISTRATION_TOKEN:${GOVERNANCE_REGISTRATION_TOKEN:}}
    dictionary:
      enabled: true
      registration-enabled: true
      registration-token: ${DICTIONARY_REGISTRATION_TOKEN:${GOVERNANCE_REGISTRATION_TOKEN:${ERROR_CATALOG_REGISTRATION_TOKEN:}}}
      preload-codes: []
      scan-packages: []
