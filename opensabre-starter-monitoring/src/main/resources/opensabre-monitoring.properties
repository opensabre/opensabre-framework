# Minimum safe application-side monitoring surface. Application configuration can override it.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,internalTokenKeyStatus
management.endpoint.env.access=none
management.endpoint.configprops.access=none
management.endpoint.beans.access=none
management.endpoint.heapdump.access=none
management.endpoint.threaddump.access=none
management.endpoint.shutdown.access=none
